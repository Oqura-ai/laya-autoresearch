[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "laya-research"
version = "0.1.0"
description = "Small, inspectable research campaigns for Laya typed decisions"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
train = ["laya==0.4.0", "torch>=2.4", "transformers>=4.48", "safetensors>=0.4"]
demo = ["datasets>=3"]
dev = ["pytest>=8", "ruff>=0.9"]

[project.scripts]
laya-research = "laya_research.cli:main"

[tool.setuptools.packages.find]
include = ["laya_research*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
